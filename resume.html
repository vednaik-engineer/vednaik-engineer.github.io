<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume - Vedant Naik</title>
    <style>
        :root {
            --primary: #000000;
            --secondary: #ffffff;
            --background: #f5f5f7;
            --accent: #0071e3;
            --text: #1d1d1f;
            --text-light: #86868b;
            --border: #d2d2d7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
            color: var(--text);
            background: #f5f5f7;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 1.2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid var(--border);
        }

        .back-button {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: opacity 0.2s;
            font-weight: 400;
        }

        .back-button:hover {
            opacity: 0.7;
        }

        .resume-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 120px 2rem 4rem;
        }

        .resume-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 1.5rem;
        }

        .download-button {
            display: inline-block;
            padding: 0.875rem 2rem;
            background: var(--accent);
            color: white;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 980px;
            transition: all 0.2s ease;
        }

        .download-button:hover {
            background: #0077ed;
            transform: scale(1.02);
        }

        .resume-viewer {
            width: 100%;
            height: 1100px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--secondary);
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
            display: block;
        }

        .resume-fallback {
            padding: 3rem 2rem;
            text-align: center;
            color: var(--text-light);
        }

        .resume-fallback a {
            color: var(--accent);
        }

        @media (max-width: 768px) {
            nav {
                padding: 1rem 1rem;
            }

            .resume-container {
                padding: 100px 1rem 2rem;
            }

            .resume-viewer {
                height: 70vh;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="back-button">
            <span>←</span> Back to Portfolio
        </a>
    </nav>

    <div class="resume-container">
        <div class="resume-header">
            <h1>Resume</h1>
            <a href="Vedant_Naik_Resume.pdf" class="download-button" download>Download PDF</a>
        </div>

        <object class="resume-viewer" data="Vedant_Naik_Resume.pdf#view=FitH" type="application/pdf">
            <div class="resume-fallback">
                <p>Your browser can't display the PDF inline.
                <a href="Vedant_Naik_Resume.pdf">Open or download it here</a>.</p>
            </div>
        </object>
    </div>
</body>
</html>
